[pytest]
# Register markers so you can run test layers separately, e.g.:
#   pytest -m unit          (fast, no server needed)
#   pytest -m integration   (TestClient, no server needed)
#   pytest tests/e2e        (needs running server + Playwright)
#   pytest tests/selenium   (needs running server + Chrome)
markers =
    unit: fast isolated tests of pure logic
    integration: API tests using TestClient

testpaths = tests
python_files = test_*.py
python_functions = test_*
